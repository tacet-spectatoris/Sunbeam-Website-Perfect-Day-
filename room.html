<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Hearth Room — Sunbeam</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header></header>

  <main class="page">
    <h1 class="site-title">The Hearth Room</h1>

    <!-- Back control (styled like the Enter button on the homepage) -->
    <a class="enter-btn" href="index.html" aria-label="Back to main gate">← Back to Main Gate</a>

    <!-- Bookshelf (uses the same .bookshelf/.shelf/.book structure from index.html) -->
    <section class="bookshelf" aria-label="Grand Bookshelf">
      <div class="shelf">
        <div class="book" style="--i:0"><div class="cover">Saron's Recipes</div></div>
        <div class="book" style="--i:1"><div class="cover">Meklit's Journal</div></div>
        <div class="book" style="--i:2"><div class="cover">Tome of Fire Magic</div></div>
        <div class="book" style="--i:3"><div class="cover">Ancient Hearth Lore</div></div>
      </div>
    </section>

    <!-- Short description (keeps the original copy) -->
    <p class="description" style="max-width:760px; text-align:center; margin-top:22px;">
      Welcome inside! Pull up a chair by the warm pixel fire. Inspect the bookshelf above to explore Saron's &amp; Meklit's collection of secrets.
    </p>
  </main>

  <footer></footer>

  <script src="./script.js"></script>
</body>
</html>
