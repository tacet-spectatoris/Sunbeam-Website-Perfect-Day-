<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sunbeam — Perfect Day</title>
  <!-- Link to styles.css at repo root -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header></header>

  <main class="page">
    <h1 class="site-title">Sunbeam — Perfect Day</h1>

    <!-- Enter control (styled as a button) -->
    <a class="enter-btn" href="room.html" aria-label="Enter the room">Enter</a>

    <!-- Bookshelf -->
    <section class="bookshelf" aria-label="Bookshelf">
      <div class="shelf">
        <!-- Example books: change the text or add image covers as needed -->
        <div class="book" style="--i:0"><div class="cover">Dawn</div></div>
        <div class="book" style="--i:1"><div class="cover">Noon</div></div>
        <div class="book" style="--i:2"><div class="cover">Dusk</div></div>
        <div class="book" style="--i:3"><div class="cover">Night</div></div>
        <div class="book" style="--i:4"><div class="cover">Dreams</div></div>
        <div class="book" style="--i:5"><div class="cover">Memory</div></div>
        <div class="book" style="--i:6"><div class="cover">Song</div></div>
        <div class="book" style="--i:7"><div class="cover">Light</div></div>
      </div>
    </section>
  </main>

  <footer></footer>

  <script src="./script.js"></script>
</body>
</html>
